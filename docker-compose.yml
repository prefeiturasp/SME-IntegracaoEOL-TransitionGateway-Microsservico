services:
  gateway:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app

      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}

      API_KEY: ${API_KEY}
      API_KEY_HEADER: ${API_KEY_HEADER:-X-API-Key}

      SIDECAR_PEDAGOGICO_URL: ${SIDECAR_PEDAGOGICO_URL}
      SIDECAR_PEDAGOGICO_API_KEY: ${SIDECAR_PEDAGOGICO_API_KEY}
      SIDECAR_PEDAGOGICO_API_KEY_HEADER: ${SIDECAR_PEDAGOGICO_API_KEY_HEADER:-X-API-Key}

      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS:-10}

      ELASTIC_APM_SERVICE_NAME: ${ELASTIC_APM_SERVICE_NAME:-transition-gateway}
      ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL:-http://localhost:8200}
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
      ELASTIC_APM_ENVIRONMENT: ${ELASTIC_APM_ENVIRONMENT:-production}
      ELASTIC_APM_ENABLED: ${ELASTIC_APM_ENABLED:-1}

    ports:
      - "8000:8000"
    restart: unless-stopped
