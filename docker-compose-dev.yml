services:
  gateway:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app

      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: django-inseguro-apenas-desenvolvimento
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"

      API_KEY: trocar_esta_chave_em_ambiente_real
      API_KEY_HEADER: X-API-Key

      SIDECAR_PEDAGOGICO_URL: http://sidecar-pedagogico:9004
      SIDECAR_PEDAGOGICO_API_KEY: ${SIDECAR_PEDAGOGICO_API_KEY:-}
      SIDECAR_PEDAGOGICO_API_KEY_HEADER: ${SIDECAR_PEDAGOGICO_API_KEY_HEADER:-X-API-Key}

      GATEWAY_TIMEOUT_SECONDS: "10"

      ELASTIC_APM_SERVICE_NAME: ${ELASTIC_APM_SERVICE_NAME:-transition-gateway}
      ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL:-http://localhost:8200}
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
      ELASTIC_APM_ENVIRONMENT: ${ELASTIC_APM_ENVIRONMENT:-local}
      ELASTIC_APM_ENABLED: ${ELASTIC_APM_ENABLED:-0}

      ENABLE_RABBITMQ_LOGGING: ${ENABLE_RABBITMQ_LOGGING:-0}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-/}
      RABBITMQ_LOG_QUEUE: ${RABBITMQ_LOG_QUEUE:-}
      RABBITMQ_LOG_LEVEL: ${RABBITMQ_LOG_LEVEL:-INFO}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}

    command: python manage.py runserver 0.0.0.0:${PORT_WEB:-8002}
    ports:
      - "${PORT_WEB:-8002}:${PORT_WEB:-8002}"
    restart: unless-stopped
