services:
  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sme_transition_gateway_web
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - .:/app
    command: >
      python -Xfrozen_modules=off -m debugpy
      --listen 0.0.0.0:${PORT_DEBUGPY:-5678} manage.py runserver 0.0.0.0:${PORT_WEB:-8000}
    ports:
      - "${PORT_WEB:-8000}:${PORT_WEB:-8000}"
      - "${PORT_DEBUGPY:-5678}:${PORT_DEBUGPY:-5678}"
    restart: unless-stopped
